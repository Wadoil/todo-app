name: CI / Build & Release

on:
  push:
    branches:
      - master

jobs:
  build-and-release:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Make Gradle wrapper executable
        run: chmod +x gradlew

      - name: Set up JDK 23
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '23'

      - name: Cache Gradle packages
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
          restore-keys: |
            ${{ runner.os }}-gradle-

      - name: Get project version
        id: get_version
        run: |
          # A more robust way to extract the version from gradle.properties
          VERSION=$(sed -n 's/^version=\(.*\)/\1/p' gradle.properties)
          echo "VERSION=$VERSION" >> $GITHUB_OUTPUT

      - name: Build (run tests and create fat JAR)
          run: ./gradlew --no-daemon clean build

      - name: Create GitHub Release and Upload Artifact
          uses: softprops/action-gh-release@v2
          with:
            tag_name: v${{ steps.get_version.outputs.VERSION }}
            name: Release v${{ steps.get_version.outputs.VERSION }}
            body: Automated release for version ${{ steps.get_version.outputs.VERSION }}
            draft: false
            prerelease: false
            files: |
              build/libs/todo-app-${{ steps.get_version.outputs.VERSION }}*.jar
            fail_on_unmatched_files: true